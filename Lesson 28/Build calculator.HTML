<!DOCTYPE html>
<html lang="en">
<head>
<title>Build Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <h1>Bill Splitter</h1>

    <label>Bill Amount ($)</label>
    <input type="number" id="billAmount" placeholder="Enter bill amount">

    <label>Tip Percentage (%)</label>
    <select id="tipPercentage">
        <option value="0">0%</option>
        <option value="5">5%</option>
        <option value="10">10%</option>
        <option value="15">15%</option>
        <option value="20">20%</option>
        <option value="25">25%</option>
    </select>

    <label>Number of People</label>
    <input type="number" id="numPeople" placeholder="Enter number of people">

    <div class="buttons">
        <button onclick="calculate()">Calculate</button>
        <button onclick="resetFields()">Reset Fields</button>
    </div>

    <div class="results">
        <p id="totalBill">Total Bill: $0.00</p>
        <p id="tipAmount">Tip Amount: $0.00</p>
        <p id="amountPerPerson">Amount Per Person: $0.00</p>
    </div>

    </div>

<script src="script.js"></script>
</body>
</html>
