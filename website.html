<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Creation Part 1 - Header & Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* --- Navigation Bar --- */
        header {
            background-color: #1d3557;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: #e63946;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: #f1faee;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #e63946;
        }

        /* --- Banner Section --- */
        .banner {
            height: 80vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
        }

        .banner h1 {
            font-size: 48px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .banner p {
            font-size: 20px;
            margin-bottom: 25px;
            max-width: 600px;
        }

        .btn-banner {
            padding: 12px 30px;
            background-color: #e63946;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-banner:hover {
            background-color: #c62828;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <a href="#" class="logo">Tasty<span>Bites</span></a>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner Section -->
    <section class="banner">
        <h1>Welcome to Tasty Bites</h1>
        <p>Experience the finest blend of delicious flavors, fresh ingredients, and cozy dining.</p>
        <button class="btn-banner" onclick="exploreMenu()">Explore Menu</button>
    </section>

    <script>
        function exploreMenu() {
            alert("Welcome! Explore our delicious offerings below.");
        }
    </script>

</body>
</html>
