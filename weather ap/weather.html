<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Weather Teller II</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <h1>World Weather Teller</h1>

    <!-- Category Tabs -->
    <div class="tabs">
      <button id="hotBtn" class="tab-btn active">Hottest Places 🔥</button>
      <button id="coldBtn" class="tab-btn">Coldest Places ❄️</button>
    </div>

    <!-- Weather List Display -->
    <div id="weatherList" class="weather-list">
      <!-- Data loaded via JS -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
